# Soporte WebSocket (Capa 7: HTTP Upgrade)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Formato de log delimitado por TAB (lo lee PostgreSQL con file_fdw)
log_format csvlog '$time_iso8601\t$remote_addr\t$request_method\t$uri\t$status\t$body_bytes_sent\t$request_time\t$host';

# DNS embebido de Docker: resuelve nombres de servicio en tiempo de ejecución
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access_csv.log csvlog;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /nginx-health {
        access_log off;
        return 200 'ok';
    }

    # ---------------- Jupyter (con WebSockets) ----------------
    location /jupyter/ {
        set $up_jupyter http://jupyter:8888;
        proxy_pass $up_jupyter;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # ---------------- Grafana ----------------
    location /grafana/ {
        set $up_grafana http://grafana:3000;
        proxy_pass $up_grafana;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ---------------- Joomla (todo lo demás) ----------------
        # ---------------- Joomla (todo lo demás) ----------------
    location / {
        set $up_joomla http://joomla:80;
        proxy_pass $up_joomla;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_redirect http://joomla/ /;
        proxy_redirect http://joomla:80/ /;
    }
}